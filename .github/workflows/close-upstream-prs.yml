name: Close pull requests opened against this repo

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const number = context.payload.pull_request.number
            const author = context.payload.pull_request.user.login

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: number,
              body: [
                `Hi @${author}, thanks for the pull request.`,
                '',
                'Changes to this project are reviewed inside your own fork, not here. Please open this pull request',
                'in your fork with the base branch set to your fork\'s `main`. See CONTRIBUTING.md for the steps.',
                '',
                'This pull request has been closed automatically.',
              ].join('\n'),
            })

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: number,
              state: 'closed',
            })
